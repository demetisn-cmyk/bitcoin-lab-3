name: Bitcoin Lab daily update

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/daily-update.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: bitcoin-lab-daily-update
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m py_compile scripts/update_lab.py scripts/model_arena.py scripts/research_sentinel.py scripts/adaptive_research.py
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/bitcoin-lab-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/bitcoin-lab-dashboard.js
      - name: Validate committed JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("data").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("valid JSON:", path)
          PY

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m py_compile scripts/update_lab.py scripts/model_arena.py scripts/research_sentinel.py
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/bitcoin-lab-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/bitcoin-lab-dashboard.js
      - name: Refresh prices and forecasts
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python scripts/update_lab.py
      - name: Run data-quality sentinel
        run: python scripts/research_sentinel.py
      - name: Build walk-forward model arena
        run: python scripts/model_arena.py
      - name: Run adaptive research loop\n        run: python scripts/adaptive_research.py\n      - name: Validate generated JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("latest.json", "forecasts.json", "model_arena.json", "quality_report.json", "adaptive_research.json"):
              path = Path("data") / name
              json.loads(path.read_text(encoding="utf-8"))
              print("valid JSON:", path)
          PY
      - name: Commit updated research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/forecasts.json data/model_arena.json data/quality_report.json data/adaptive_research.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh BTC/EUR research data"
            git push
          fi
