name: Bitcoin Lab daily update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/daily-update.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: bitcoin-lab-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Refresh prices and forecasts
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python scripts/update_lab.py
      - name: Build walk-forward model arena
        run: python scripts/model_arena.py
      - name: Commit updated research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/forecasts.json data/model_arena.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh BTC/EUR research data"
            git push
          fi
